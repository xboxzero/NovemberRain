[package]
name = "engine"
version = "0.1.0"
edition = "2021"
description = "NovemberRain core: scene simulation, sound synthesis and natural-language command parsing"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
